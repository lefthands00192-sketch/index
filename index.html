<!DOCTYPE html>
<!--
  ==================================================================
  학급 웹앱을 감싸는 페이지 (GitHub Pages에 올리는 파일)
  ------------------------------------------------------------------
  · 하는 일: 구글 앱스스크립트 웹앱을 iframe으로 화면 전체에 꽉 채워 보여 줌
    → 웹앱 위쪽의 'Google Apps Script 사용자가 만들었습니다' 배너가 보이지 않음
  · 고칠 곳은 딱 한 군데: 아래 <script> 안의 WEBAPP_URL 에 웹앱 주소(/exec로 끝남)를 붙여넣기
  · 로그인 정보·아이디는 이 페이지나 주소에 절대 들어가지 않음
    (로그인은 웹앱 안에서 하고, 이 페이지는 웹앱 화면을 보여 주기만 함)
  ==================================================================
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 휴대폰에서 화면이 축소돼 보이지 않게: 화면 너비 = 기기 너비, 처음 배율 1배
       (iframe 안 웹앱이 아니라 '맨 바깥 페이지'인 이 파일의 설정이 휴대폰 화면 크기를 정함) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색 사이트에 학급 페이지가 나오지 않게 -->
  <meta name="robots" content="noindex, nofollow">
  <!-- 휴대폰 주소창 색 (학급 웹앱의 칠판 초록) -->
  <meta name="theme-color" content="#2F4A3C">
  <!-- 탭 제목: 웹앱이 열리면 학급 이름(예: 2학년 5반)으로 저절로 바뀜 -->
  <title>학급 웹앱</title>
  <!-- 탭 아이콘 (그림 파일 없이 글자 그림으로) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">

  <style>
    /* ---------- 페이지 전체: 여백·스크롤 없음 (스크롤은 웹앱 안에서만) ---------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;              /* 바깥 페이지가 따로 스크롤되면 화면이 두 겹으로 움직여서 막음 */
      background: #2F4A3C;           /* 웹앱이 뜨기 전 잠깐 보이는 바탕 (칠판 초록) */
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    /* ---------- 웹앱 화면: 화면 전체를 꽉 채움 ---------- */
    #app {
      position: fixed;               /* 휴대폰 주소창이 나타났다 사라져도 늘 화면에 딱 맞게 */
      top: 0; left: 0; right: 0; bottom: 0;
      /* 아이폰(사파리)은 iframe 너비를 안쪽 내용에 맞춰 늘려 버리는 경우가 있음
         → 너비 1px + 최소 너비 100%로 '화면 너비'에 고정 */
      width: 1px;
      min-width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;       /* 다 뜨기 전에는 아래 '불러오는 중'이 비쳐 보임 */
    }

    /* ---------- 불러오는 중 (웹앱 뒤에 깔려 있다가 웹앱이 뜨면 가려짐) ---------- */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      color: #F4F1E8; font-size: 16px; text-align: center; padding: 16px;
    }
    #loading .dot {                  /* 빙글빙글 도는 동그라미 */
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: #F2C94C;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 오래 걸릴 때 아래쪽에 뜨는 안내 줄 ---------- */
    #slow {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: none;                 /* 처음엔 숨김 (25초 안에 웹앱이 뜨면 끝까지 안 보임) */
      align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));   /* 아이폰 아래 홈 막대 피하기 */
      background: rgba(30, 40, 35, 0.94); color: #fff; font-size: 14px; line-height: 1.4; text-align: center;
    }
    #slow.show { display: flex; }
    #slow a {
      color: #1F3A2E; background: #F2C94C; border-radius: 999px; padding: 6px 14px;
      text-decoration: none; font-weight: bold; white-space: nowrap;
    }
    #slow button {
      background: none; border: 1px solid rgba(255,255,255,0.5); color: #fff; border-radius: 999px;
      padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }

    /* ---------- 웹앱 주소를 아직 안 넣었을 때의 안내 ---------- */
    #setup { display: none; position: fixed; inset: 0; overflow: auto; color: #F4F1E8; padding: 24px 16px; box-sizing: border-box; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
    #setup.show { display: block; }
    #setup div { max-width: 560px; margin: 0 auto; }
    #setup code { background: rgba(255,255,255,0.12); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <!-- 불러오는 중 (웹앱 뒤에 깔림) -->
  <div id="loading" aria-hidden="true">
    <div class="dot"></div>
    <div>학급 웹앱을 여는 중…</div>
  </div>

  <!-- 웹앱이 들어갈 자리 (주소는 아래 스크립트가 넣음)
       allow = 웹앱이 쓰는 기능을 이 페이지가 허락해 줌
         · geolocation     : 날씨·천문력의 [현재 위치] 버튼 (버튼을 누를 때만 권한을 물어봄)
         · clipboard-write : 주소·명렬표 [복사] 버튼
         · web-share       : 휴대폰 공유 기능 (쓰게 될 경우 대비)
         · fullscreen      : 크게 보기 (쓰게 될 경우 대비)
       sandbox 는 일부러 넣지 않음 → 파일 내려받기·새 탭 열기·파일 올리기가 막히지 않게 -->
  <iframe id="app" title="학급 웹앱"
          allow="geolocation; clipboard-write; web-share; fullscreen"
          allowfullscreen></iframe>

  <!-- 25초가 지나도 안 열리면 보이는 안내 -->
  <div id="slow" role="status">
    <span>화면이 열리지 않나요?</span>
    <a id="slowLink" href="#" target="_top" rel="noopener">웹앱 바로 열기</a>
    <button type="button" onclick="document.getElementById('slow').classList.remove('show')">닫기</button>
  </div>

  <!-- 웹앱 주소를 아직 안 넣었을 때 -->
  <div id="setup">
    <div>
      <h2>🏫 웹앱 주소를 넣어 주세요</h2>
      <p>이 파일(index.html)의 <code>WEBAPP_URL</code> 자리에 학급 웹앱 주소를 붙여넣고 다시 올려 주세요.</p>
      <p>웹앱 주소는 Apps Script 편집기의 <b>배포 → 배포 관리</b>에 있는 <b>웹 앱 URL</b>이에요. (<code>…/exec</code>로 끝나요)</p>
    </div>
  </div>

  <noscript>
    <p style="color:#fff;padding:16px;">이 페이지는 자바스크립트가 켜져 있어야 열려요.</p>
  </noscript>

  <script>
    // ================================================================
    // ★ 여기에 학급 웹앱 주소를 붙여넣으세요 ★
    //   예) 'https://script.google.com/macros/s/AKfy....../exec'
    //   · 따옴표(' ') 안에 넣기
    //   · 주소 뒤에 ?아이디= 같은 것을 붙이지 마세요 (로그인은 웹앱 안에서 해요)
    // ================================================================
    var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwDA9J84CDG4AcAXBsFjzr9bqO6Gf1owJZ2gj8kFOLG4HZUIRq4Zvt68bc3YrdCP9jlhw/exec';


    // ---------------- 아래는 고치지 않아도 돼요 ----------------

    (function () {
      var frame = document.getElementById('app');

      // ① 주소가 제대로 들어갔는지 확인 (https로 시작하고 /exec 또는 /dev로 끝나야 함)
      var url = String(WEBAPP_URL || '').trim();
      if (!/^https:\/\/script\.google\.com\/.+\/(exec|dev)$/.test(url)) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('setup').classList.add('show');
        frame.style.display = 'none';
        return;
      }

      // ② 웹앱을 iframe에 넣음 (주소에는 웹앱 주소만, 로그인 정보·아이디는 넣지 않음)
      frame.src = url;
      document.getElementById('slowLink').href = url;   // 안 열릴 때 '바로 열기'용

      // ③ 25초 안에 웹앱이 열리지 않으면 아래쪽에 안내 줄을 보여 줌
      //   [수정] '열렸다'의 기준 = 웹앱의 신호(④) 또는 iframe 이 다 불러와짐(load) 중 하나라도 오면
      //          (예전: 신호만 기다려서, 웹앱이 잘 열렸는데도 신호가 안 닿으면 안내 줄이 떴음)
      var ready = false;
      function opened() {
        ready = true;
        clearTimeout(slowTimer);
        document.getElementById('slow').classList.remove('show');
        document.getElementById('loading').style.display = 'none';
      }
      var slowTimer = setTimeout(function () {
        if (!ready) document.getElementById('slow').classList.add('show');
      }, 25000);
      frame.addEventListener('load', opened);

      // ④ 웹앱이 보내는 신호 받기
      //    · 구글 앱스스크립트 화면(…googleusercontent.com)에서 온 것만 믿음
      //    · 받는 내용: '다 열렸어요' + 학급 이름(탭 제목) 뿐 (로그인 정보는 오가지 않음)
      window.addEventListener('message', function (e) {
        if (!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/.test(e.origin)) return;
        var d = e.data;
        if (!d || d.app !== 'class25' || d.type !== 'ready') return;
        opened();
        // 탭 제목을 학급 이름으로 (글자로만 넣으므로 이상한 내용이 와도 안전)
        if (typeof d.title === 'string' && d.title.trim()) document.title = d.title.trim().slice(0, 40);
      });
    })();
  </script>
</body>
</html>
